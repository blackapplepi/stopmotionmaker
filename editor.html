<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#25231f;font:14px system-ui,-apple-system,sans-serif}
button,input,select{font:inherit}button{border:1px solid #d9d4ca;background:white;border-radius:9px;padding:9px 12px}
.app{max-width:1500px;margin:auto;background:#fbfaf7;min-height:100vh}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid #d9d4ca;flex-wrap:wrap}
.logo{font-size:18px;font-weight:800}.sub{font-size:12px;color:#77736b}.toolbar{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
main{display:grid;grid-template-columns:230px 1fr 250px;min-height:800px}
aside{padding:15px;background:#faf9f5;border-right:1px solid #d9d4ca}.right{border-left:1px solid #d9d4ca;border-right:0}
section.stage{padding:15px;display:flex;flex-direction:column;gap:10px;min-width:0}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#6e695f}
.list{display:grid;gap:6px}.obj{width:100%;text-align:left;display:flex;align-items:center;gap:8px}
.thumb{width:36px;height:36px;display:grid;place-items:center;background:#f0eee8;border-radius:7px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}
.fileBtn input{display:none}.add{width:100%;margin-top:7px}.hint{font-size:12px;color:#77736b}
.stagebox{display:flex;justify-content:center;background:#e7e2d9;border:1px solid #d9d4ca;border-radius:14px;padding:10px}
canvas{max-width:100%;height:auto;touch-action:none;background:#f4b59d;border-radius:5px}
.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.stat{font-size:12px;color:#77736b}
.timeline{border:1px solid #d9d4ca;border-radius:12px;padding:10px;background:white}.frames{display:flex;gap:6px;overflow:auto}
.frame{min-width:62px}.active{outline:2px solid #ef6b55}
.row{display:flex;gap:7px;align-items:center;margin:8px 0}.row label{width:75px;color:#77736b}
input[type=range]{flex:1}.value{width:45px;text-align:right;color:#77736b}
@media(max-width:1050px){main{grid-template-columns:200px 1fr}.right{display:none}}
@media(max-width:720px){main{grid-template-columns:1fr}aside{display:none}header{padding:9px}.toolbar{width:100%;margin:0}.toolbar button{flex:1}section.stage{padding:8px}}
</style>

<div class="app">
<header>
<div><div class="logo">🎬 Stop-Motion Desk Pro</div><div class="sub">v1.1 — fixed Streamlit package</div></div>
<div class="toolbar">
<button type="button" id="newBtn">New</button>
<label class="fileBtn"><button type="button" id="openBtn">Open</button><input id="open" type="file" accept=".json"></label>
<button type="button" id="saveBtn">Save</button><button type="button" id="exportBtn">Export WebM</button>
</div></header>
<main>
<aside>
<h3>Objects <span id="count">0/30</span></h3>
<div id="library" class="list"></div>
<div class="add"><div class="hint" style="margin-bottom:6px">＋ Import Photos</div><input id="images" type="file" accept="image/*" multiple style="display:block;width:100%;padding:10px;border:1px solid #d9d4ca;border-radius:9px;background:white"></div>
<button class="add" onclick="camera()">📷 Take Photo</button>
<h3>On stage</h3><div id="stageList" class="list"></div>
<button class="add" onclick="resetSample()">Reset sample</button>
</aside>
<section class="stage">
<div class="stagebox"><canvas id="c" width="540" height="540"></canvas></div>
<div class="controls">
<button onclick="play()" id="play">▶ Play</button><button onclick="capture()">Capture frame</button>
<label class="stat">FPS <input id="fps" type="number" min="1" max="30" value="8" style="width:60px"></label>
<label class="stat">Onion <input id="onion" type="checkbox"></label><span class="spacer"></span><span class="stat" id="status">Ready</span>
</div>
<div class="timeline"><div class="row"><b id="label">01 / 01</b><span class="stat" id="dur">0.13 s</span><span class="spacer"></span><button onclick="dup()">Duplicate</button><button onclick="del()">Delete</button></div><div id="frames" class="frames"></div></div>
</section>
<aside class="right">
<h3>Project</h3>
<div class="row"><label>Format</label><select id="format"><option>1:1</option><option>16:9</option><option>9:16</option></select></div>
<div class="row"><label>Onion opacity</label><input id="op" type="range" min=".05" max=".7" step=".05" value=".22"></div>
<div class="row"><label>Previous</label><input id="oc" type="range" min="1" max="3" value="1"></div>
<div class="row"><label>Backdrop</label><input id="bg" value="#f4b59d"></div>
<label class="stat"><input id="autosave" type="checkbox" checked> Auto-save</label>
<h3>Selected</h3><b id="sel">None</b>
<div class="row"><label>X</label><input id="x" type="number"></div>
<div class="row"><label>Y</label><input id="y" type="number"></div>
<div class="row"><label>Scale</label><input id="scale" type="range" min=".1" max="4" step=".01"><span id="sv" class="value"></span></div>
<div class="row"><label>Rotate</label><input id="rot" type="range" min="-180" max="180"><span id="rv" class="value"></span></div>
<button onclick="removeSel()">Remove object</button>
<p class="hint">Mouse/touch/trackpad dragging is supported. Pinch/rotate gestures are planned for the next revision.</p>
</aside>
</main></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);
let objects=[],stage=[],frames=[],cur=0,sel=null,drag=null,playing=false,timer=null;
const samples=[['Milo','🧸'],['Willow','🌿'],['Stones','🪨'],['Juniper','🐿️'],['Daisies','🌼'],['Ball','🏖️'],['Mushrooms','🍄'],['Cottage','🏠'],['Bench','🪑'],['Lantern','🏮'],['Cactus','🌵'],['Parcel','📦']];
function uid(){return Math.random().toString(36).slice(2,9)}
function libObj(name,emoji,img=null){return{id:uid(),name,emoji,img}}
function make(o,x=c.width/2,y=c.height/2){return{id:uid(),name:o.name,emoji:o.emoji,img:o.img||null,x,y,scale:1,rot:0,w:100,h:100}}
function size(){let f=$('format').value;c.width=f==='16:9'?720:f==='9:16'?405:540;c.height=f==='16:9'?405:f==='9:16'?720:540}
function library(){ $('count').textContent=objects.length+'/30';$('library').innerHTML=objects.map(o=>`<button class=obj onclick="add('${o.id}')"><span class=thumb>${o.img?`<img src="${o.img}">`:o.emoji}</span>${o.name}</button>`).join('')}
function list(){ $('stageList').innerHTML=stage.map(o=>`<button class=obj onclick="select('${o.id}')"><span class=thumb>${o.img?`<img src="${o.img}">`:o.emoji}</span>${o.name}</button>`).join('')||'<span class=hint>No objects yet.</span>'}
function add(id){let o=objects.find(x=>x.id===id);if(!o)return;let n=make(o);stage.push(n);select(n.id);render()}
function select(id){sel=stage.find(o=>o.id===id)||null;$('sel').textContent=sel?sel.name:'None';if(sel){$('x').value=sel.x;$('y').value=sel.y;$('scale').value=sel.scale;$('rot').value=sel.rot}sync();list();render()}
function sync(){$('sv').textContent=(+$('scale').value||1).toFixed(2);$('rv').textContent=(+$('rot').value||0)+'°'}
function draw(o,a=1){ctx.save();ctx.globalAlpha=a;ctx.translate(o.x,o.y);ctx.rotate(o.rot*Math.PI/180);let w=o.w*o.scale,h=o.h*o.scale;if(o.img){let im=new Image();im.onload=render;im.src=o.img;if(im.complete)ctx.drawImage(im,-w/2,-h/2,w,h)}else{ctx.font=(64*o.scale)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.emoji,0,4)}ctx.restore()}
function render(){ctx.fillStyle=$('bg').value||'#f4b59d';ctx.fillRect(0,0,c.width,c.height);if($('onion').checked){let n=+$('oc').value,op=+$('op').value;for(let i=1;i<=n;i++)if(frames[cur-i])frames[cur-i].stage.forEach(o=>draw(o,op/i))}stage.forEach(o=>draw(o));if(sel){ctx.strokeStyle='#ef6b55';ctx.setLineDash([5,4]);ctx.strokeRect(sel.x-sel.w*sel.scale/2-5,sel.y-sel.h*sel.scale/2-5,sel.w*sel.scale+10,sel.h*sel.scale+10);ctx.setLineDash([])}framesUI()}
function snap(){return{stage:stage.map(o=>({...o})),bg:$('bg').value,format:$('format').value}}
function restore(f){stage=(f.stage||[]).map(o=>({...o}));$('bg').value=f.bg||'#f4b59d';if(f.format)$('format').value=f.format;size();sel=null;list()}
function capture(){frames[cur]=snap();if(cur===frames.length-1)frames.push(snap());cur=Math.min(cur+1,frames.length-1);$('status').textContent='Frame captured';render();auto()}
function go(i){cur=i;restore(frames[i]);render()}
function framesUI(){$('frames').innerHTML=frames.map((f,i)=>`<button class="frame ${i===cur?'active':''}" onclick="go(${i})">${String(i+1).padStart(2,'0')}</button>`).join('');$('label').textContent=String(cur+1).padStart(2,'0')+' / '+String(Math.max(frames.length,1));$('dur').textContent=(1/(+$('fps').value||8)).toFixed(2)+' s'}
function dup(){frames.splice(cur+1,0,JSON.parse(JSON.stringify(frames[cur])));cur++;go(cur);auto()}
function del(){if(frames.length<=1)return;frames.splice(cur,1);cur=Math.max(0,cur-1);go(cur);auto()}
function play(){if(playing){playing=false;clearInterval(timer);$('play').textContent='▶ Play';return}playing=true;$('play').textContent='⏸ Pause';timer=setInterval(()=>go((cur+1)%frames.length),1000/(+$('fps').value||8))}
function removeSel(){if(!sel)return;stage=stage.filter(o=>o.id!==sel.id);sel=null;list();render();auto()}
function resetSample(){objects=samples.map(x=>libObj(x[0],x[1]));stage=[make(objects[0],c.width*.4,c.height*.5),make(objects[1],c.width*.65,c.height*.5),make(objects[2],c.width*.5,c.height*.7)];frames=[snap()];cur=0;library();list();render();auto()}
function newProject(){stage=[];frames=[snap()];cur=0;sel=null;list();render();auto()}
function download(b,n){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function save(){download(new Blob([JSON.stringify({version:'1.1',objects,frames,current:cur,fps:+$('fps').value,format:$('format').value})],{type:'application/json'}),'stop-motion-project-v1.1.json')}
$('open').onchange=e=>{let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);objects=d.objects||objects;frames=d.frames||[];cur=0;$('fps').value=d.fps||8;$('format').value=d.format||'1:1';size();restore(frames[0]);library();render()}catch(x){alert('Could not open project')}};r.readAsText(e.target.files[0])}
function exportWebM(){if(!c.captureStream||!window.MediaRecorder){alert('WebM export is not supported in this browser.');return}let fps=+$('fps').value||8,rec=new MediaRecorder(c.captureStream(fps)),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>download(new Blob(chunks,{type:'video/webm'}),'stop-motion.webm');rec.start();let i=0,t=setInterval(()=>{go(i++);if(i>=frames.length){clearInterval(t);setTimeout(()=>rec.stop(),150)}},1000/fps)}

function camera(){if(!navigator.mediaDevices?.getUserMedia){alert('Camera is unavailable.');return}let v=document.createElement('video');v.autoplay=true;v.playsInline=true;let box=document.createElement('div');box.style='position:fixed;inset:10%;z-index:99;background:white;padding:15px;border-radius:12px';box.innerHTML='<b>Camera</b><br>';box.append(v);let b=document.createElement('button');b.textContent='Capture';b.onclick=()=>{let x=document.createElement('canvas');x.width=v.videoWidth||720;x.height=v.videoHeight||1280;x.getContext('2d').drawImage(v,0,0);objects.push(libObj('Camera photo','📷',x.toDataURL('image/jpeg',.9)));library();v.srcObject?.getTracks().forEach(t=>t.stop());box.remove();auto()};box.append(b);document.body.append(box);navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(s=>v.srcObject=s).catch(e=>{box.remove();alert(e.message)})}
function auto(){if(!$('autosave').checked)return;try{localStorage.setItem('smdpro11',JSON.stringify({objects,frames,current:cur,fps:+$('fps').value,format:$('format').value}))}catch(e){}}
['x','y'].forEach(id=>$(id).oninput=()=>{if(sel){sel[id==='x'?'x':'y']=+$(''+id).value;render();auto()}})
$('scale').oninput=()=>{if(sel)sel.scale=+$('scale').value;sync();render();auto()}
$('rot').oninput=()=>{if(sel)sel.rot=+$('rot').value;sync();render();auto()}
$('format').onchange=()=>{size();render();auto()};['bg','op','oc'].forEach(id=>$(id).oninput=()=>{render();auto()});$('onion').onchange=render
c.onpointerdown=e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height;for(let i=stage.length-1;i>=0;i--){let o=stage[i],rad=Math.max(o.w,o.h)*o.scale/2;if(Math.hypot(x-o.x,y-o.y)<rad){select(o.id);drag={o,dx:x-o.x,dy:y-o.y};c.setPointerCapture(e.pointerId);break}}}
c.onpointermove=e=>{if(!drag)return;let r=c.getBoundingClientRect();drag.o.x=(e.clientX-r.left)*c.width/r.width-drag.dx;drag.o.y=(e.clientY-r.top)*c.height/r.height-drag.dy;$('x').value=Math.round(drag.o.x);$('y').value=Math.round(drag.o.y);render();auto()};c.onpointerup=()=>drag=null;c.onpointercancel=()=>drag=null
// Mobile-safe event bindings: use real buttons/inputs instead of relying on label/button nesting.
$('newBtn').addEventListener('click', newProject);
$('saveBtn').addEventListener('click', save);
$('exportBtn').addEventListener('click', exportWebM);
$('cameraBtn').addEventListener('click', camera);
$('openBtn').addEventListener('click', ()=>$('open').click());
$('images').addEventListener('change', e=>{[...e.target.files].forEach(f=>{if(!f.type.startsWith('image/'))return;let r=new FileReader();r.onload=x=>{let im=new Image();im.onload=()=>{let ratio=im.naturalWidth/im.naturalHeight||1;let h=100,w=Math.max(40,Math.round(h*ratio));objects.push({...libObj(f.name.replace(/\.[^.]+$/,''),'🖼️',x.target.result),w,h});library();auto()};im.src=x.target.result};r.readAsDataURL(f)});e.target.value=''});
size();resetSample()
</script>
